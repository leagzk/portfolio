	<path d="M36.8,56.722c0,0-14.138-2.04-18.366-2.696c-7.673-1.191-6.474-10.846,0.427-10.278c6.701,0.552,19.463,1.56,19.463,1.56"/>
	<path d="M36.61,56.792c0,0-10.161,0.071-15.847,0.069c-6.924-0.002-7.507,9.596,0.212,10.443c8.011,0.879,15.66,1.616,23.228,2.422l12.542,1.438c8.913,1.117,17.93,2.492,27.51,4.475"/>
</g>
