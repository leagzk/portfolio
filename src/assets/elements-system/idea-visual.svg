<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="500" height="500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10">
<!--
  Vignette au trait de la card MCP (chapitre 07 de system-practice-elements).
  Memes conventions que governance-visual.svg et design-visual.svg, a
  reappliquer apres chaque re-export depuis Illustrator - il les perd toutes,
  et sans bruit :

  1. PAS DE DISQUE. L'aplat rond vient du conteneur (.el-fig__badge dans
     system-practice-elements.astro), qui porte deja son fond blanc et son
     ombre. Le <circle cx=50 cy=50 r=36.5 fill=#e9f6ff> de l'export a ete
     retire. Le viewBox de 100 est garde tel quel.
  2. currentColor, jamais une couleur en dur. L'export pose stroke:#231f20 ;
     sans conversion le trait reste noir dans les quatre themes au lieu de
     suivre --accent.
  3. PAS DE BLOC <style>. Cet export-ci sort des attributs de presentation et
     non des classes .st0 - tant mieux : Astro inline le SVG dans la page, donc
     un <style> y deviendrait GLOBAL et deux vignettes exportees le meme jour se
     repeindraient l'une l'autre. Ce qui est commun (fill, stroke, linecap,
     linejoin, miterlimit) est remonte sur la racine.
  4. LE COMMENTAIRE VIT DANS LA RACINE, et la balise <svg> tient sur une seule
     ligne en portant width/height. Un commentaire place AVANT <svg>, ou une
     racine sans dimensions, fait echouer le build sur NoImageMetadata.

  Pas de crochet d'animation ici : contrairement a la vignette gouvernance de
  l'accueil, cette pastille ne reagit pas au survol.
-->
