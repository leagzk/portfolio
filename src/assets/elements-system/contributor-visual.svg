<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="500" height="500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10">
<!--
  Vignette au trait du parcours praticien (contributor) sur le chapitre 07 de
  system-practice-elements. Memes conventions que les trois autres vignettes du
  site, a reappliquer apres chaque re-export depuis Illustrator - il les perd
  toutes, et sans bruit :

  1. PAS DE DISQUE. L'aplat rond vient du conteneur (.el-path__s), qui porte
     deja son fond, son ombre et son anneau de survol. Le <path> de fond en #F0FFD2 de l'export a
     ete retire. Le viewBox de 100 est garde tel quel : le dessin conserve son
     rapport au disque, qui occupait 73% de la boite. Ce qui deborde est voulu -
     c'est meme le sujet ici, le dessin sort de la pastille.
  5. UN CROCHET D'ANIMATION : class="plant" sur le groupe de la tige et de ses
     trois feuilles. Le bas de sa boite tombe sur le pied de la tige, la ou elle
     rejoint les mains : c'est ce qui permet de la faire pousser depuis sa base
     (voir .el-path__i .plant dans la page). La pousse se joue a L'ARRIVEE DU
     BLOC dans le champ, pas au survol - sur mobile il n'y a pas de pointeur.
     Sans cette classe rien ne se joue, silencieusement.
  2. currentColor, jamais une couleur en dur. L'export pose stroke:#231F20 ;
     sans conversion le trait reste noir dans les quatre themes au lieu de
     suivre --accent.
  3. PAS DE style="..." PAR ELEMENT. Illustrator repete la meme declaration sur
     chaque trace. Tout ce qui est commun - fill, stroke, linecap, linejoin,
     miterlimit - est remonte en attributs de presentation sur la racine.
  4. NI PROLOGUE XML NI COMMENTAIRE AVANT LA RACINE. L'export commence par
     <?xml?> et une ligne « Generator: Adobe Illustrator » : les deux precedent
     <svg>, et c'est exactement ce qui fait echouer le build sur
     NoImageMetadata. La racine tient sur une ligne et porte width/height.
-->
