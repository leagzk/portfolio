<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10">
<!--
  Vignette au trait de la tuile « hands dirty first ». Memes conventions que
  governance-visual.svg, a reappliquer apres chaque re-export :

  1. PAS DE DISQUE. L'aplat vient du conteneur (.dc-hand dans index.astro), qui
     porte le fond. Le cercle d'origine - fill #FDE9F1, cx/cy 50, r 36,5 - a ete
     retire, et le viewBox de 100 conserve : le disque occupait 73% de la boite,
     ce qui deborde est voulu.
  2. currentColor PARTOUT, jamais une couleur en dur. Ici l'encre est blanche,
     posee par le conteneur, parce que le fond est l'accent de marque.

  Trois retouches propres a cet export, en plus de la conversion des couleurs :
  - les `style="..."` d'Illustrator sont passes en attributs de presentation, et
    ce qui est commun (linecap, linejoin, miterlimit) est remonte sur le <svg> ;
  - deux elements sont des aplats et non des traits - la pointe du crayon et le
    petit triangle : ils prennent fill="currentColor" et stroke="none" ;
  - un tracé OUVERT portait fill:#FFD9F3. Un remplissage sur une courbe ouverte
    est un artefact d'export : il peignait un croissant rose qui n'a rien a faire
    la. Passe a fill="none".
-->
