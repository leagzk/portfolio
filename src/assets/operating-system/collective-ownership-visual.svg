<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="500" height="500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10">
<!--
  Vignette au trait du bloc « collective ownership » sur /operating-system.
  Memes conventions que les cinq autres vignettes du site, a reappliquer apres
  chaque re-export depuis Illustrator - il les perd toutes, et sans bruit :

  1. PAS DE DISQUE. L'aplat rond vient du conteneur (.op-hinge__disc dans la
     page), qui porte deja son fond blanc. Le <circle cx=50 cy=50 fill=#E9F6FF>
     de l'export a ete retire, et le viewBox de 100 garde tel quel : le dessin
     conserve son rapport au disque, ce qui deborde est voulu.
  2. currentColor, jamais une couleur en dur. L'export pose stroke:#231F20 ;
     sans conversion le trait reste noir - invisible sur un aplat blanc pose
     dans un bloc noir.
  3. PAS DE style="..." PAR ELEMENT. Illustrator repete la meme declaration sur
     chaque trace. Ce qui est commun - fill, stroke, linecap, linejoin,
     miterlimit - est remonte en attributs de presentation sur la racine.
     Attention aussi a `style="enable-background:..."` sur la racine elle-meme,
     qui ne sert a rien et part avec.
  4. NI PROLOGUE XML NI COMMENTAIRE AVANT LA RACINE. L'export commence par
     <?xml?> et une ligne « Generator: Adobe Illustrator » : les deux precedent
     <svg>, et c'est exactement ce qui fait echouer le build sur
     NoImageMetadata. La racine tient sur une ligne et porte width/height.

  AUCUN CROCHET D'ANIMATION, et c'est une decision mesuree.

  Une orbite du trio de cubes a ete construite puis retiree. Le dessin ne s'y
  prete pas : les mains encadrent le trio au plus juste - le creux qu'elles
  menagent fait 14,5 unites de rayon quand le trio, lui, en balaie 20,7 des
  qu'il tourne. Un triangle balaie toujours bien plus large que son empreinte
  immobile. Mesure faite sur 619 points echantillonnes le long des deux traces :
  il aurait fallu reduire le trio a 65% pour degager un blanc d'un seul pixel a
  tous les angles, et a 60% pour qu'il soit franc.

  Ce n'est pas un reglage a trouver, c'est un dessin different. La composition
  vaut mieux telle quelle : trois cubes tenus, encadres par deux mains, en echo
  a la phrase posee a cote.
-->
