<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="500" height="500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10">
<!--
  Vignette au trait du chapitre 05 de /system-brand : une main qui assemble des
  volumes, pour les variations de la plateforme. Memes conventions que
  governance-visual.svg sur l'accueil - Illustrator les perd toutes a chaque
  re-export, et sans bruit :

  1. PAS DE DISQUE. Le <circle style="fill:#FFF5CF" cx="50" cy="50" r="36.5"> de
     l'export a ete retire. Ici, contrairement aux autres vignettes du site,
     AUCUN aplat ne le remplace : le dessin est pose a meme le bandeau blanc
     d'<Equations>, ou il joue le filigrane. Le viewBox de 100 est garde tel
     quel, donc le dessin conserve ses proportions d'origine.
  2. currentColor, jamais une couleur en dur. L'export pose stroke:#231F20
     quatorze fois ; sans conversion le trait resterait noir dans les quatre
     themes, et le passage en gris clair sur mobile n'aurait aucun effet.
  3. PAS DE BLOC <style>. Celui-ci n'en avait pas - Illustrator avait sorti des
     styles inline - mais un re-export peut en produire : Astro inline le SVG
     dans la page, donc ce <style> deviendrait GLOBAL et repeindrait les autres
     vignettes. Tout est passe en attributs de presentation, sur la racine.
  4. Pas de crochet d'animation : ce dessin habille le bandeau, il ne raconte
     pas de geste.
-->
