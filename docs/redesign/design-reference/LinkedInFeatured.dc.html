<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800;900&amp;family=Maven+Pro:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0708}
.og{position:relative;width:1200px;height:627px;overflow:hidden;font-family:'Hanken Grotesk',sans-serif;background:#0A0708;color:#fff}

</helmet>
<div class="og">
  <svg class="ab" ref="{{setGhost}}" aria-hidden="true" viewBox="0 -150 1000 196" preserveAspectRatio="xMinYMax meet" style="left: -10px; bottom: 0px; width: 948px; height: 295px; position: absolute"><text x="0" y="0" style="font-family:'Hanken Grotesk',sans-serif;font-size:190px;font-weight:900;letter-spacing:-0.03em;fill:rgba(255,255,255,0.08)">portfolio</text></svg>

  <div class="ab" style="left:1038px;right:0;bottom:0;height:180px;background:#F5CD00"></div>
  <div class="ab" style="left:80px;right:302px;top:140px;display:flex;flex-direction:column;gap:30px">
    
    
    <p class="eb" style="margin-bottom:-6px">Moving design practice forward</p><h1 class="h" style="font-size:47px;white-space:nowrap">I nurture the design practice <br>and the people, not just the system. <br>That's my leadership bet.</h1><span class="sb"><i></i><span class="eb" style="color:#fff">Léa Giezek</span></span>
  </div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":627}}'>
class Component extends DCLogic {
  componentDidMount() {
    const fit = () => {
      try {
        const g = this.ghostEl; const t = g && g.querySelector('text');
        if (!t) return; const b = t.getBBox();
        if (b.width) g.setAttribute('viewBox', b.x + ' ' + b.y + ' ' + b.width + ' ' + b.height);
      } catch (e) {}
    };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit); else fit();
    this.t = setTimeout(fit, 400);
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() { return { setGhost: (el) => { this.ghostEl = el; } }; }
}
</script>
</body>
</html>
